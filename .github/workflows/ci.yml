name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      operations: ${{ steps.filter.outputs.operations }}
      python: ${{ steps.filter.outputs.python }}
      terraform: ${{ steps.filter.outputs.terraform }}
      terraform_exists: ${{ steps.terraform-exists.outputs.exists }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect relevant paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - "**/*.py"
              - "requirements*.txt"
              - ".github/workflows/ci.yml"
            frontend:
              - "apps/web/**"
              - ".github/workflows/ci.yml"
            backend:
              - "Caddyfile*"
              - "Dockerfile*"
              - "docker-compose*.yml"
              - "requirements*.txt"
              - "recsys_loom/**"
              - "services/**"
              - "scripts/**"
              - "ops/**"
              - ".github/workflows/ci.yml"
            operations:
              - "Caddyfile*"
              - "docker-compose*.yml"
              - "ops/**"
              - ".github/workflows/ci.yml"
            terraform:
              - "infra/**/*.tf"
              - "infra/**/*.tfvars"
              - "infra/**/*.hcl"
              - "monitoring/**"
              - ".github/workflows/ci.yml"

      - name: Detect Terraform configuration
        id: terraform-exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git ls-files 'infra/*.tf' 'infra/**/*.tf')" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: Python unit tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-ci.txt

      - name: Run existing unit tests
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend lint and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: https://example.invalid
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-image:
    name: Backend serving image
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: combined
            dockerfile: Dockerfile.serving
          - name: recommendation
            dockerfile: Dockerfile.recommendation
          - name: search
            dockerfile: Dockerfile.search
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build serving image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: recsys-loom-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  terraform:
    name: Terraform format and validate
    needs: changes
    if: >-
      needs.changes.outputs.terraform == 'true' &&
      needs.changes.outputs.terraform_exists == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize and validate Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            git ls-files 'infra/**/versions.tf' |
              xargs -n1 dirname |
              sort -u
          )
          (( ${#roots[@]} > 0 )) || {
            echo "No Terraform roots found under infra/" >&2
            exit 1
          }
          for root in "${roots[@]}"; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

  operations:
    name: Operations configuration
    needs: changes
    if: needs.changes.outputs.operations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find ops -type f -name '*.sh' -print0)

      - name: Validate production Compose interpolation
        env:
          ALLOWED_ORIGINS: https://demo.vercel.app
          API_DOMAIN: api.example.com
          IMAGES_DIR: /tmp/recsys-images
          MODEL_VERSION: synthetic-lab-v1
          RECOMMENDATION_IMAGE: example.invalid/recommendation@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RECOMMENDATION_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RELEASE_DIR: /tmp/recsys-release
          SEARCH_IMAGE: example.invalid/search@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SEARCH_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e API_DOMAIN=api.example.com
          -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.10-alpine
          caddy validate --config /etc/caddy/Caddyfile

  result:
    name: CI result
    if: always()
    needs:
      - changes
      - python
      - frontend
      - backend-image
      - operations
      - terraform
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable checks
        env:
          BACKEND_RESULT: ${{ needs.backend-image.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$CHANGES_RESULT" \
            "$PYTHON_RESULT" \
            "$FRONTEND_RESULT" \
            "$BACKEND_RESULT" \
            "$OPERATIONS_RESULT" \
            "$TERRAFORM_RESULT"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "A required CI job ended with status: $result" >&2
                exit 1
                ;;
            esac
          done
