services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./images:/app/images:ro
      - ./articles.csv:/app/articles.csv:ro
    environment:
      - RECSYS_HOST=0.0.0.0
      - SEARCH_SEMANTIC=${SEARCH_SEMANTIC:-0}
      - SEARCH_VISUAL=${SEARCH_VISUAL:-0}
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000
    depends_on:
      - api
